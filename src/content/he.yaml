hero:
  title: "החממה"
  tagline: "מרחב חי ליצירה משותפת, ללמידה קהילתית ולחדשנות שבמרכזה האדם."
  intro: "החממה היא קהילה קטנה ופתוחה לאנשים שרוצים ליצור יחד — בלי להפוך כל רעיון לסטארט-אפ, כל קבוצה לארגון, או כל שיתוף פעולה להיררכיה."
  primary: { label: "פתחו בשיחה", href: "mailto:greenhouse.hamama@gmail.com" }
  secondary: { label: "גלו מה אנחנו עושים", href: "#what" }

portal_card:
  label: "פורטל החממה"
  text: "מרחב פתוח לגילוי יוזמות, צרכים והזדמנויות לשיתוף פעולה — כולל יוזמות שנולדו מחוץ לחממה."
  cta: { label: "לגלות יוזמות ←", href: "https://portal.hamama.org" }

why:
  title: "למה החממה קיימת"
  intro: "הרבה רעיונות טובים נשארים בראש של אדם אחד. בקהילות רבות יש כישרון, אנרגיה ורצון טוב — אבל אין דרך פשוטה להפוך את האנרגיה הזו לעשייה משותפת. החממה קיימת כדי לחקור את השאלות האלה הלכה למעשה."
  questions:
    - "איך יוצרים יחד בלי בוס?"
    - "איך החלטות צומחות בלי לכפות על אנשים מבנה אחד?"
    - "איך מכירים בסוגים שונים של תרומה?"
    - "איך טכנולוגיה יכולה לתמוך באמון, בחופש ובאחריות?"

what:
  title: "מה אנחנו עושים"
  intro: "בחממה אפשר להביא רעיונות בשלב מוקדם לשיחה, למצוא שותפים ושפה משותפת, ולהפוך מחשבות מעורפלות ליוזמות ברורות יותר."
  items:
    - { title: "להביא רעיון בראשיתו", text: "לבחון אותו עם אחרים ולתת לו להתבהר דרך שיחה." }
    - { title: "למצוא שותפים", text: "לקבל משוב, למצוא שותפים לדרך ושפה משותפת סביב העבודה." }
    - { title: "להפוך לממשי", text: "להפוך מחשבה מעורפלת ליוזמה ברורה יותר או לניסוי קטן." }
    - { title: "לחקור דרכי התארגנות", text: "לחקור דרכים מבוזרות לתיאום ולשיתוף בערך." }
    - { title: "ללמוד מאחרים", text: "ללמוד מקהילות, ממעבדות ומרשתות דומות ברחבי העולם." }

focus:
  title: "תחומי המיקוד שלנו כיום"
  portal:
    title: "פורטל היוזמות העתידיות"
    subtitle: "שער פתוח לאקוסיסטם רחב יותר"
    text: "מקום שבו רעיונות, אנשים, צרכים ויוזמות עצמאיות יכולים למצוא זה את זה וליצור שיתופי פעולה חדשים גם מעבר לחממה."
    cta: { label: "לפורטל היוזמות ←", href: "https://portal.hamama.org" }
  cards:
    - title: "VAST"
      subtitle: "ערכת כלים לייחוס ולשיתוף ערך"
      text: "מסגרת וכלים שעוזרים לקבוצות למפות תרומות ולחקור דרכים הוגנות להכיר בערך ולחלוק אותו לאורך זמן."
      dark: true
    - title: "מערכות קהילתיות"
      subtitle: "תשתית דיגיטלית לקהילות מבוזרות"
      text: "כלים ליוזמות, להצעות, להחלטות משותפות, למעקב אחר תרומות, לבעלות משותפת ולניסויים בממשל פתוח."
      cta: { label: "למערכות הקהילתיות ב-GitHub", href: "https://github.com/ouripoupko/communities2" }
    - title: "חדשנות שבמרכזה האדם"
      subtitle: "אנשים, טכנולוגיה וחברה"
      text: "מקום להעמקה בקהילות מבוזרות, בטכנולוגיה אתית, באמון, בקשב ובממשקים חדשים בין קהילות למוסדות."

work:
  title: "איך אנחנו עובדים"
  intro: "בחממה אין היררכיה קבועה. אנשים מתקבצים סביב מה שחשוב להם, לוקחים אחריות באופן טבעי, ונותנים למבנה לצמוח מתוך הקבוצה עצמה."
  items:
    - { title: "להתחיל מאנרגיה אמיתית", text: "לשים לב למה שבאמת אכפת לאנשים." }
    - { title: "בלי כפייה", text: "אנשים מצטרפים, מובילים, עוצרים או צועדים הצידה לפי המחויבות האמיתית שלהם." }
    - { title: "להפוך דברים לממשיים", text: "לעבור ממילים גדולות לניסויים קטנים." }
    - { title: "לשמור על בעלות משותפת", text: "רעיונות, קרדיט וערך לא צריכים להיעלם לידיים של אדם אחד." }
    - { title: "לתת לממשל לצמוח", text: "המערכות הקהילתיות צומחות מתוך הפעולות והצרכים של הקבוצה." }

book:
  eyebrow: "ספר / הרהור אישי"
  title: "The Human Fabric"
  subtitle: "הרהור אישי מתוך ניסוי החממה"
  body: "The Human Fabric הוא הרהור אישי של גיא בלאט, אחד מיוזמי החממה. הספר אינו מתיימר לדבר בשם כל חברי החממה, וגם לא להגדיר את הקהילה באופן סופי. זהו ניסיון לתעד שכבה אחת של למידה מניסוי קטן וחי בקהילה, בנוכחות, באחריות, בטכנולוגיה וביצירה משותפת. הספר עוסק במתח שבין חום למבנה, בין ריפוי אישי לפרקטיקה קהילתית, בין מנהיגות מבוזרת לאחריות משותפת, ובין טכנולוגיה לנוכחות אנושית. החממה עצמה רחבה יותר מכל טקסט, אדם או פרשנות."
  invite: "הספר מוצע כהזמנה פתוחה לחשוב, לשאול ולהמשיך את השיחה."
  read: { label: "לקריאה והורדה של הספר (באנגלית)", href: "https://drive.google.com/file/d/1yoBRf1t1FerX7NBWePWRv8pY5OZ0TVcE/view?usp=sharing" }
  talk: { label: "לפתוח שיחה על הספר", href: "mailto:greenhouse.hamama@gmail.com" }
  cover_title: "The Human Fabric"
  cover_subtitle: "Personal Journey, Collective Lessons, and the Greenhouse Experiment"
  quote: "״קהילות אינן נבנות פעם אחת. הן נארגות שוב ושוב — דרך קשב, אחריות, אמון, קונפליקט, תיקון ואכפתיות.״"

connect:
  title: "בואו נראה מה יכול לצמוח יחד."
  text: "אם אתם בונים קהילה, מתחילים יוזמה משותפת, חוקרים מודלים חדשים של ערך, או שואלים שאלות דומות — נשמח להיפגש."
  email: "greenhouse.hamama@gmail.com"
  closing: "ביחד, לאט ובאחריות."
